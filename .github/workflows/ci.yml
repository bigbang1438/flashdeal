name: FlashDeal CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  backend:
    name: 后端构建与测试（JDK 21 + H2）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 项目零外部依赖：不需要 services（无 MySQL / Redis / Docker）
      - name: 运行全部测试
        run: mvn -B verify

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: flashdeal-jar
          path: target/flashdeal.jar
          retention-days: 7

  frontend:
    name: 前端构建与测试（Node 22 + Vite）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: 运行前端测试
        run: npm test

      - name: 构建前端产物
        run: npm run build

      - name: 上传前端产物
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  smoke:
    name: 启动冒烟测试（真实 HTTP）
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: 打包（跳过测试，测试已在 backend job 跑过）
        run: mvn -B clean package -DskipTests

      - name: 后台启动应用
        run: |
          nohup java -jar target/flashdeal.jar > app.log 2>&1 &
          echo "等待应用启动..."
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8080/api/metrics/summary > /dev/null; then
              echo "应用已就绪（第 ${i} 次探测）"
              exit 0
            fi
            sleep 2
          done
          echo "应用启动失败，日志如下："
          cat app.log
          exit 1

      - name: 冒烟：创建商品与活动
        run: |
          curl -sf -X POST http://127.0.0.1:8080/api/admin/products \
            -H 'Content-Type: application/json' \
            -d '{"name":"CI冒烟商品","description":"smoke","priceCents":19900}' | tee product.json
          PID=$(python3 -c "import json;print(json.load(open('product.json'))['data']['id'])")
          START=$(date -d '-1 minute' '+%Y-%m-%d %H:%M:%S')
          END=$(date -d '+30 minute' '+%Y-%m-%d %H:%M:%S')
          curl -sf -X POST http://127.0.0.1:8080/api/admin/activities \
            -H 'Content-Type: application/json' \
            -d "{\"productId\":$PID,\"title\":\"CI冒烟活动\",\"seckillPriceCents\":9900,\"totalStock\":10,\"startTime\":\"$START\",\"endTime\":\"$END\"}" | tee activity.json
          echo "PID=$PID" >> $GITHUB_ENV

      - name: 冒烟：秒杀下单与支付
        run: |
          AID=$(python3 -c "import json;print(json.load(open('activity.json'))['data']['id'])")
          curl -sf -X POST http://127.0.0.1:8080/api/seckill/orders \
            -H 'Content-Type: application/json' \
            -d "{\"activityId\":$AID,\"userId\":9001,\"quantity\":1,\"idempotentToken\":\"ci-smoke-1\"}" | tee order.json
          ORDER_NO=$(python3 -c "import json;print(json.load(open('order.json'))['data']['orderNo'])")
          curl -sf -X POST http://127.0.0.1:8080/api/seckill/pay/callback \
            -H 'Content-Type: application/json' \
            -d "{\"orderNo\":\"$ORDER_NO\",\"payChannel\":\"MOCK\",\"paidAmountCents\":9900}"
          echo "订单 $ORDER_NO 支付完成"

      - name: 冒烟：指标端点
        run: curl -sf http://127.0.0.1:8080/api/metrics | head -c 2000

      - name: 失败时输出应用日志
        if: failure()
        run: cat app.log

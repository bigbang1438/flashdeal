server:
  port: 0

spring:
  datasource:
    # 测试用内存库：每个测试 JVM 一份，跑得快且互不污染
    url: jdbc:h2:mem:flashdeal-test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
    hikari:
      maximum-pool-size: 24
      minimum-idle: 4
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

flashdeal:
  cache:
    l2: embedded
    namespace: "test:"
  stock:
    mode: db-cas
  lock:
    mode: local
  rate-limit:
    order:
      algorithm: token-bucket
      # 测试默认给足配额，避免限流干扰业务断言；限流专项测试单独构造小配额限流器
      capacity: 1000000
      refill-per-second: 1000000
      user-capacity: 1000000
      user-refill-per-second: 1000000
  order:
    pay-timeout-seconds: 300
    expire-scan-interval-millis: 60000
  mq:
    order:
      ring-buffer-size: 65536
      batch-size: 64
      consumer-threads: 4
      max-retry: 3
    stock:
      ring-buffer-size: 65536
      batch-size: 128
      consumer-threads: 2
  metrics:
    latency-buffer-size: 8192

logging:
  level:
    root: WARN
    com.flashdeal: INFO
    org.springframework.test: WARN
